name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Force the deterministic diagnosis path. CI must never depend on an API
      # key being present, and must never spend money on a push.
      SENTINEL_LLM_ENABLED: "false"
      # The validation agent copies the repo and runs the suite inside it;
      # this stops that nested run from spawning a further sandbox.
      SENTINEL_SANDBOX_CHILD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build
        working-directory: dashboard
        run: |
          npm ci
          npm run build
